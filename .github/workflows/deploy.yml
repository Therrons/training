name: Deploy – Build & Push Docker Image

# Builds Docker image and pushes to DockerHub
# Runs on pushes to develop, Docker, and K8s branches
# Note: K8s deployment is handled locally via deploy-https.sh script
on:
  push:
    branches: [ "develop", "Docker", "K8s" ]
  workflow_dispatch:

# Required for GitHub OIDC:
#   id-token: write  → job can request a JWT from GitHub's OIDC provider
#   contents: read   → checkout
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:     ${{ vars.AWS_REGION }}        # e.g. af-south-1
  IMAGE_NAME:     fraud-poc-api

jobs:
  # ── Build & Push Docker image to DockerHub ─────────────────────────────────
  build-and-push:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to AWS using OIDC to fetch secrets for smoke test
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ vars.AWS_ACTIONS_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-build

      # Fetch credentials from AWS Secrets Manager for smoke test
      - name: Fetch secrets from AWS Secrets Manager
        id: aws_secrets
        env:
          SECRET_NAME: ${{ vars.AWS_SECRET_NAME }}
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --region "${{ env.AWS_REGION }}" \
            --query SecretString \
            --output text)

          DB_USERNAME=$(echo "$SECRET_JSON" | jq -r '.DB_USERNAME // empty')
          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.DB_PASSWORD // empty')

          # Redact values from logs
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"

          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            APP_DLL=fraud_poc_project.dll
            APP_PORT=8080

      - name: Verify Docker image
        run: |
          echo "✓ Docker image built and pushed to DockerHub"
          echo ""
          echo "Image details:"
          echo "  Repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "  SHA tag:    ${{ github.sha }}"
          echo "  Latest tag: latest"
          echo ""
          echo "Full image path:"
          echo "  ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Log build completion
        run: |
          echo "✓ Docker image built and pushed successfully"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Latest: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Next step: Run locally on your machine:"
          echo "  bash deploy-https.sh"
          echo ""
          echo "This will:"
          echo "  1. Fetch secrets from AWS Secrets Manager"
          echo "  2. Deploy to your local Rancher Desktop K8s cluster"
          echo "  3. Set up HTTPS with self-signed certificate"
