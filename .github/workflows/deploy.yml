name: Deploy – Terraform + Docker

# Runs on pushes to main (and branches already used by the project).
# PRs only run the lighter ci.yml checks.
on:
  push:
    branches: [ "main", "Docker", "K8s" ]
  workflow_dispatch:

# Required for GitHub OIDC:
#   id-token: write  → job can request a JWT from GitHub's OIDC provider
#   contents: read   → checkout
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:     ${{ vars.AWS_REGION }}        # e.g. af-south-1
  TF_WORKING_DIR: terraform
  IMAGE_NAME:     fraud-poc-api

jobs:
  # ── 1. Terraform – provision OIDC role + Secrets Manager secret ───────────────
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    outputs:
      secret_name:             ${{ steps.tf_output.outputs.secret_name }}
      github_actions_role_arn: ${{ steps.tf_output.outputs.github_actions_role_arn }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate using the bootstrap role (broader permissions, used only to
      # run Terraform).  After the first apply the narrower app role exists and
      # is used by the next job.
      - name: Configure AWS credentials (bootstrap role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ vars.BOOTSTRAP_ROLE_ARN }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_org:   ${{ github.repository_owner }}
          TF_VAR_github_repo:  ${{ github.event.repository.name }}
          TF_VAR_db_password:  ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_region:   ${{ env.AWS_REGION }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_org:   ${{ github.repository_owner }}
          TF_VAR_github_repo:  ${{ github.event.repository.name }}
          TF_VAR_db_password:  ${{ secrets.DB_PASSWORD }}
          TF_VAR_aws_region:   ${{ env.AWS_REGION }}
        run: terraform apply -auto-approve tfplan

      - name: Capture Terraform outputs
        id: tf_output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "secret_name=$(terraform output -raw secret_name)"             >> "$GITHUB_OUTPUT"
          echo "github_actions_role_arn=$(terraform output -raw github_actions_role_arn)" >> "$GITHUB_OUTPUT"

  # ── 2. Build & run Docker image with credentials injected from Secrets Manager ─
  build-and-run:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Re-authenticate using the narrower app role that Terraform just ensured exists.
      - name: Configure AWS credentials (app role via OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ needs.terraform.outputs.github_actions_role_arn }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-app

      # Pull { username, password } from Secrets Manager and export as masked
      # step-level env vars.  They are never written to disk or printed in logs.
      - name: Fetch PostgreSQL credentials from Secrets Manager
        id: fetch_secret
        env:
          SECRET_NAME: ${{ needs.terraform.outputs.secret_name }}
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query SecretString \
            --output text)

          DB_USERNAME=$(echo "$SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(echo "$SECRET_JSON" | jq -r '.password')

          # Redact values from all subsequent log lines
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_PASSWORD"

          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          # Credentials are NOT baked into the image – they are injected at run time.
          # Build args here are only for non-secret build customisation.
          build-args: |
            APP_DLL=fraud_poc_project.dll
            APP_PORT=8080

      # Smoke-test: run the image locally in the runner, injecting the credentials
      # fetched from Secrets Manager as runtime env vars.
      - name: Run container smoke test
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          SECRET_NAME: ${{ needs.terraform.outputs.secret_name }}
        run: |
          docker run --rm \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e DB_HOST="$DB_HOST" \
            -e DB_PORT="${DB_PORT:-5432}" \
            -e DB_NAME="$DB_NAME" \
            -e AWSSecretName="$SECRET_NAME" \
            -e AWSRegion="${{ env.AWS_REGION }}" \
            -e ASPNETCORE_ENVIRONMENT="RELEASE" \
            -p 8080:8080 \
            --name api-test \
            -d \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080/health/readiness
          docker stop api-test
