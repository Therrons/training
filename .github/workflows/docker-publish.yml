name: CI - Docker + Helm Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ "main", "Docker", "K8s" ]

env:
  IMAGE_NAME: fraud-poc-api
  IMAGE_TAG: ci
  CHART_PATH: charts
  NAMESPACE: fraud-poc-api

jobs:
  ci-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    name: PR Checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg APP_PORT=8080 -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Run container smoke test
        run: |
          docker run -d -p 8080:8080 \
            -e ASPNETCORE_ALLOWEDHOSTS="*" \
            --name api-test \
            $IMAGE_NAME:$IMAGE_TAG
          sleep 10
          curl -f http://localhost:8080/health/readiness || { echo "::error::Readiness check failed. Verify PostgreSQL and Kafka is running. If not start PostgreSQL and Kafka in K8S and rerun the github runner"; exit 1; }
          curl -f http://localhost:8080/health/liveness || { echo "::error::Liveness check failed. Verify PostgreSQL and Kafka is running. If not start PostgreSQL and Kafka in K8S and rerun the github runner"; exit 1; }

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint $CHART_PATH

      - name: Render Helm (dev)
        run: |
          helm template fraud-poc-api $CHART_PATH \
            -f $CHART_PATH/values-dev.yaml \
            > rendered.yaml

      - name: Comment PR summary
        uses: actions/github-script@v7
        with:
          script: |
            const body = `✅ CI checks completed.

            - Docker image built
            - App started successfully
            - Helm lint & schema validation passed
            `;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  ci-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ dev ]

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint $CHART_PATH

      - name: Render Helm (${{ matrix.env }})
        run: |
          helm template fraud-poc-api $CHART_PATH \
            -f $CHART_PATH/values-${{ matrix.env }}.yaml \
            > rendered-${{ matrix.env }}.yaml