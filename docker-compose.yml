services:
  postgres:
    image: postgres:16-alpine
    container_name: fraud_poc_project_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"  # Expose to host for local dev/debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DLL: "fraud_poc_project.dll"
    image: fraud_poc_project:offline
    container_name: fraud_poc_project
    depends_on:
      postgres:
        condition: service_healthy  # Wait for DB to be ready
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "RELEASE"
      # PostgreSQL credentials – injected as individual env vars so Program.cs
      # picks them up directly (no Secrets Manager call needed locally).
      # Values come from .env via ${...} substitution.
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres          # Docker Compose service name
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
    expose:
      - "8080"
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api    # simplified, no health condition
    ports:
      - "8085:8085" # docker-compose port 8085 maps to nginx port 8085
    volumes:
      - ./nginx.conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
    driver: bridge

volumes:
  postgres_data:  # Named volume for PostgreSQL data persistence
