services:
  postgres:
    image: postgres:16-alpine
    container_name: docke_web_api_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"  # Expose to host for local dev/debugging
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persist data
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: 
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DLL: "docke_web_Api.dll"
    image: docke_web_api:offline
    container_name: docke_web_api
    depends_on:
      postgres:
        condition: service_healthy  # Wait for DB to be ready
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: "LOC"  # "Production"
      # Connection string - use service name 'postgres' as hostname
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    expose:
      - "8080"
    networks:
      - edge
    logging: 
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"


  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api    # simplified, no health condition
    ports:
      - "8085:8085" # this says that docker-compose port 8085 maps to nginx port 8085 of the server property
    volumes:
      - ./nginx.conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    logging: 
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

networks:
  edge:
    driver: bridge

volumes:
  postgres_data:  # Named volume for PostgreSQL data persistence