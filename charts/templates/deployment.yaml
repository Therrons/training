{{- if and .Values.persistence.enabled (eq .Values.persistence.perReplica false) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fraud-poc-api.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "fraud-poc-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "fraud-poc-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "fraud-poc-api.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          env:
            - name: ASPNETCORE_URLS
              value: {{ .Values.env.ASPNETCORE_URLS | quote }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.env.ASPNETCORE_ENVIRONMENT | quote }}
            {{- if .Values.env.BUILD_DATE }}
            - name: BUILD_DATE
              value: {{ .Values.env.BUILD_DATE | quote }}
            {{- end }}
            {{- if .Values.env.BUILD_VERSION }}
            - name: BUILD_VERSION
              value: {{ .Values.env.BUILD_VERSION | quote }}
            {{- end }}
            # Database configuration for Kubernetes
            {{- if .Values.env.DB_HOST }}
            - name: DB_HOST
              value: {{ .Values.env.DB_HOST | quote }}
            {{- end }}
            {{- if .Values.env.DB_PORT }}
            - name: DB_PORT
              value: {{ .Values.env.DB_PORT | quote }}
            {{- end }}
            {{- if .Values.env.DB_NAME }}
            - name: DB_NAME
              value: {{ .Values.env.DB_NAME | quote }}
            {{- end }}
            {{- if .Values.env.DB_USERNAME }}
            - name: DB_USERNAME
              value: {{ .Values.env.DB_USERNAME | quote }}
            {{- end }}
            {{- if .Values.env.DB_PASSWORD }}
            - name: DB_PASSWORD
              value: {{ .Values.env.DB_PASSWORD | quote }}
            {{- end }}
            {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.k8sSecretName }}
            - name: DB_Id
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.k8sSecretName }}
                  key: DB_Id
            - name: DB_Secret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecrets.k8sSecretName }}
                  key: DB_Secret
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | quote }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readinessPeriodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath | quote }}
              port: {{ .Values.containerPort }}
            initialDelaySeconds: {{ .Values.probes.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessPeriodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fraud-poc-api.fullname" . }}-pvc
        {{- end }}
        {{- end }}
{{- end }}