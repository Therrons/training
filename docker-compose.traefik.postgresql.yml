networks:
  local:
    driver: bridge

volumes:
  kafka_data_local:
  postgres_data_local:

services:
  # ========================================
  # INFRASTRUCTURE: Traefik (Local)
  # ========================================
  traefik:
    image: traefik:v3.6
    container_name: traefik-local
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"        # Main HTTP entry point
      - "8080:8080"    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # INFRASTRUCTURE: Kafka (Local)
  # ========================================
  kafka:
    image: bitnamilegacy/kafka:3.9.0
    container_name: kafka-local
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # ======= KRaft mode configuration =======
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ======= Listeners =======
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,SASL_PLAINTEXT://:9094,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_PLAINTEXT://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ======= SASL configuration - support both PLAIN and SCRAM-SHA-256 =======
      KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_CFG_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      KAFKA_CLIENT_USERS: kafka-admin
      KAFKA_CLIENT_PASSWORDS: kafka-admin-pass
      KAFKA_BROKER_USER: kafka-admin
      KAFKA_BROKER_PASSWORD: kafka-admin-pass

      # ======= Auto-create topics =======
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local

  # ========================================
  # INFRASTRUCTURE: Kafka UI (Local)
  # ========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-local
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SASL_ENABLED: "false"
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - local

  # ========================================
  # DATABASE: PostgreSQL (Local)
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: fraud_poc_project_postgres_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    environment:
      # ======= PostgreSQL Core Configuration =======
      POSTGRES_USER: "therrons"
      POSTGRES_PASSWORD: "therrons"
      POSTGRES_DB: "fraud_db"

      # ======= PostgreSQL Advanced Settings =======
      # Connection settings
      POSTGRES_INITDB_ARGS: >
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=2621kB
        -c min_wal_size=1GB
        -c max_wal_size=4GB
        -c max_worker_processes=2
        -c max_parallel_workers_per_gather=1
        -c max_parallel_workers=2

      # Logging configuration
      POSTGRES_LOG_STATEMENT: all
      POSTGRES_LOG_DURATION: "on"
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 1000

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therrons"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ========================================
  # APPLICATION: Fraud Detection API (Local)
  # ========================================
  fraud-api:
    image: fraud-poc-api:latest
    container_name: fraud-poc-api-local
    build:
      context: ./src
      dockerfile: fraud_poc_project_ui/Dockerfile
    ports:
      - "5000:8080"
    environment:
      # ======= Application Configuration =======
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      # ======= Database Connection =======
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fraud_db
      DB_USERNAME: therrons
      DB_PASSWORD: therrons

      # ======= Kafka Configuration =======
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: kafka-admin
      KAFKA_PASSWORD: kafka-admin-pass
      KAFKA_GROUP_ID: fraud-detection-group
      KAFKA_TRANSACTION_TOPIC: fraud-transactions
      KAFKA_DLT_TOPIC: fraud-transactions.dlt

      # ======= API Authentication =======
      API_USERNAME: admin
      API_PASSWORD: admin-password
      JWT_SECRET: your-secret-key-change-in-production-at-least-32-chars
      JWT_ISSUER: fraud-detection-system
      JWT_AUDIENCE: fraud-detection-api
      JWT_EXPIRATION_MINUTES: 60

      # ======= CORS Configuration =======
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000

      # ======= Logging =======
      LOG_LEVEL: Information
      ENABLE_STRUCTURED_LOGGING: "true"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fraud-api.rule=Host(`localhost`)"
      - "traefik.http.routers.fraud-api.entrypoints=web"
      - "traefik.http.services.fraud-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
