# ============================================================================
# LOCAL DEVELOPMENT WORKFLOW:
#
# 1. START EVERYTHING:
#    docker-compose -f docker-compose.local.yml up -d
#
# 2. WAIT FOR SERVICES (30-60 seconds):
#    docker-compose -f docker-compose.local.yml ps
#    (Wait until all containers show "Up")
#
# 3. ACCESS SERVICES:
#    - Traefik Dashboard:  http://localhost:8080
#    - API:                http://localhost/api
#    - API Health:         http://localhost/api/health
#    - Swagger:            http://localhost/swagger
#    - Load Simulator:     http://localhost/load-simulator.html
#    - Kafka UI:           http://localhost/kafka
#    - Direct API:         http://localhost:8080/api
#
# 4. TEST API:
#    curl http://localhost/api/health
#    curl http://localhost/swagger
#    curl -X POST "http://localhost/api/load/simulate?count=50&highFraudRatio=0.2"
#
# 5. VIEW LOGS:
#    docker-compose -f docker-compose.local.yml logs -f api
#    docker-compose -f docker-compose.local.yml logs -f kafka
#    docker-compose -f docker-compose.local.yml logs -f postgres
#
# 6. STOP EVERYTHING:
#    docker-compose -f docker-compose.local.yml down
#
# SERVICES INCLUDED:
#
# - Traefik: Reverse proxy, routes traffic to services
# - Kafka: Message broker for fraud events
# - Kafka UI: Visual interface to view Kafka topics and messages
# - PostgreSQL: Database for storing fraud evaluation results
# - C# API: Your fraud detection application
#
# ARCHITECTURE:
#
#   HTTP Request (port 80)
#         ↓
#   Traefik (localhost:8080 dashboard)
#         ↓
#   ┌─────┴──────┬──────────┐
#   ↓            ↓          ↓
#  /api         /kafka    /health
#   ↓            ↓          ↓
#  API       Kafka-UI      API
#   ↓            ↓          ↓
# Kafka      Kafka-UI      Health
# & DB
#
# ============================================================================
